name: Build PythonFar DLLs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_platform: x64
            python_arch: x64
          - arch: x86
            cmake_platform: Win32
            python_arch: x86
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
    
    - name: Create build directory
      run: |
        if not exist build mkdir build
        if not exist logs mkdir logs
      shell: cmd
    
    - name: Download self-contained Python (${{ matrix.arch }})
      run: .\setup_python.ps1 -Arch ${{ matrix.arch }}
      shell: pwsh
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.cmake_platform }}
      shell: cmd
    
    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release
      shell: cmd
    
    - name: Copy test plugin
      run: copy python\test_plugin.far.py build\Release\test_plugin.far.py
      shell: cmd
    
    - name: Copy runtime DLLs next to test exe
      run: |
        # Place runtime DLLs next to the test exe so it loads the SAME
        # python311.dll that matches python_runtime\Lib (no system Python).
        Copy-Item "build\Release\python_runtime\DLLs\*.dll" "build\Release\" -Force
        Copy-Item "build\Release\python_runtime\DLLs\*.pyd" "build\Release\" -Force -ErrorAction SilentlyContinue
      shell: pwsh
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      shell: cmd
    
    - name: Copy logs to workspace
      if: always()
      run: |
        copy "%TEMP%\pythonfar_*.log" logs\ 2>nul
        dir logs\
      shell: cmd
    
    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-logs-${{ matrix.arch }}
        path: logs\*.log
        if-no-files-found: ignore
    
    - name: Upload DLL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-dlls-${{ matrix.arch }}
        path: |
          build/Release/PythonFar.dll
          build/Release/PythonFar.adapter.dll
          python/far_struct_offsets.json
        retention-days: 30
    
