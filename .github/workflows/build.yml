name: Build PythonFar DLLs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHONFAR_LOG_LEVEL: TRACE
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x64 build + tests on the standard x64 runner.
          - arch: x64
            cmake_platform: x64
            runner: windows-latest
            run_tests: true
          # x86 (Win32) binaries run fine on the x64 runner, so test natively.
          - arch: x86
            cmake_platform: Win32
            runner: windows-latest
            run_tests: true
          # ARM64 native build + tests on GitHub's ARM64 runner.
          - arch: arm64
            cmake_platform: ARM64
            runner: windows-11-arm
            run_tests: true

    name: ${{ matrix.arch }} (${{ matrix.runner }})
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
    
    - name: Create build directory
      run: |
        if not exist build mkdir build
        if not exist logs mkdir logs
      shell: cmd
    
    - name: Cache python_runtime (${{ matrix.arch }})
      uses: actions/cache@v4
      with:
        path: build/Release/PythonFar/python_runtime
        key: python-runtime-3.11.9-${{ matrix.arch }}

    - name: Cache python SDK (${{ matrix.arch }})
      uses: actions/cache@v4
      with:
        path: build/python_sdk
        key: python-sdk-3.11.9-${{ matrix.arch }}

    - name: Download self-contained Python (${{ matrix.arch }})
      run: .\setup_python.ps1 -Arch ${{ matrix.arch }}
      shell: pwsh
    
    - name: Cache googletest (${{ matrix.arch }})
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: gtest-v1.14.0-${{ matrix.cmake_platform }}

    - name: Configure CMake
      run: |
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.cmake_platform }}
      shell: cmd
    
    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release
      shell: cmd
    
    - name: Copy runtime DLLs next to test exe
      if: ${{ matrix.run_tests }}
      run: |
        # Place runtime DLLs next to the test exe so it loads the SAME
        # python311.dll that matches python_runtime\Lib (no system Python).
        Copy-Item "build\Release\PythonFar\python_runtime\DLLs\*.dll" "build\Release\" -Force
        Copy-Item "build\Release\PythonFar\python_runtime\DLLs\*.pyd" "build\Release\" -Force -ErrorAction SilentlyContinue
      shell: pwsh
    
    - name: Run tests
      if: ${{ matrix.run_tests }}
      run: |
        cd build
        ctest --output-on-failure -C Release
      shell: cmd
    
    - name: Copy logs to workspace
      if: always()
      run: |
        copy "%TEMP%\pythonfar_*.log" logs\ 2>nul
        dir logs\
      shell: cmd
    
    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-logs-${{ matrix.arch }}-${{ matrix.runner }}
        path: logs\*.log
        if-no-files-found: ignore
    
    - name: Upload DLL artifacts
      # Cross-build and native ARM64 produce identical DLLs; only upload from
      # one ARM64 job (the native runner) to avoid duplicate artifact names.
      if: ${{ matrix.arch != 'arm64' || matrix.run_tests }}
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-dlls-${{ matrix.arch }}
        path: |
          build/Release/PythonFar/PythonFar.dll
          build/Release/PythonFar/PythonFar.adapter.dll
          build/Release/PythonFar/python/**
        retention-days: 30

  deploy-far:
    name: Deploy to Far ${{ matrix.far_tag }} (${{ matrix.arch }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        far_tag:
          - latest
          - ci/v3.0.6687.4869
        arch:
          - x64
          - x86
          - arm64

    steps:
    - uses: actions/checkout@v6

    - name: Download built PythonFar artifacts (${{ matrix.arch }})
      uses: actions/download-artifact@v4
      with:
        name: pythonfar-dlls-${{ matrix.arch }}
        path: artifacts

    - name: Restore python_runtime from cache (${{ matrix.arch }})
      uses: actions/cache@v4
      with:
        path: artifacts/python_runtime
        key: python-runtime-3.11.9-${{ matrix.arch }}

    - name: Resolve Far Manager tag
      id: far_tag
      run: |
        if ('${{ matrix.far_tag }}' -eq 'latest') {
            $headers = @{
                'User-Agent'    = 'PythonFar-CI'
                'Authorization' = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            }
            $tag = (Invoke-RestMethod `
                -Uri 'https://api.github.com/repos/FarGroup/FarManager/releases?per_page=1' `
                -Headers $headers | Select-Object -First 1).tag_name
        } else {
            $tag = '${{ matrix.far_tag }}'
        }
        $safe = $tag -replace '[/\\]', '-'
        Write-Host "Resolved tag: $tag (safe: $safe)"
        "tag=$tag"       >> $env:GITHUB_OUTPUT
        "safe=$safe"     >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Cache Far Manager (${{ matrix.arch }})
      uses: actions/cache@v4
      with:
        path: far
        key: far-${{ steps.far_tag.outputs.safe }}-${{ matrix.arch }}

    - name: Download Far Manager and deploy adapter
      run: |
        $params = @{
            Tag   = '${{ steps.far_tag.outputs.tag }}'
            Arch  = '${{ matrix.arch }}'
            Build = 'artifacts'
            Dest  = 'far'
        }
        .\setup_far.ps1 @params
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh

    - name: Verify deployment
      if: always()
      run: |
        $safeTag = '${{ matrix.far_tag }}' -replace '[/\\]', '-'
        $dest    = "far\Adapters\PythonFar"
        if (Test-Path $dest) {
            Get-ChildItem -Recurse $dest | Select-Object FullName, Length | Format-Table | Out-String |
                Set-Content "deploy-verify-$safeTag-${{ matrix.arch }}.txt"
            Get-ChildItem -Recurse $dest
        } else {
            Write-Host "Adapters dir not found: $dest"
        }
      shell: pwsh

    - name: Upload deployment verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: far-deploy-verify-${{ steps.far_tag.outputs.safe }}-${{ matrix.arch }}
        path: deploy-verify-*.txt
        if-no-files-found: ignore
