name: Build PythonFar DLLs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_platform: x64
            python_arch: x64
          - arch: x86
            cmake_platform: Win32
            python_arch: x86
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11 (${{ matrix.arch }})
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: ${{ matrix.python_arch }}
    
    - name: Verify Python architecture
      run: python -c "import struct; arch='64' if struct.calcsize('P')==8 else '32'; print(f'Python {arch}-bit'); exit(0 if (arch=='64')==('${{ matrix.arch }}'=='x64') else 1)"
      shell: cmd
    
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.cmake_platform }}
      shell: cmd
    
    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release
      shell: cmd
    
    - name: Copy test plugin
      run: copy python\test_plugin.far.py build\Release\python\test_plugin.far.py
      shell: cmd
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      shell: cmd
    
    - name: Upload DLL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-dlls-${{ matrix.arch }}
        path: |
          build/Release/PythonFar.dll
          build/Release/PythonFar.adapter.dll
          python/far_struct_offsets.json
        retention-days: 30
    

