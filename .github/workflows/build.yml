name: Build PythonFar DLLs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_platform: x64
            python_arch: x64
          - arch: x86
            cmake_platform: Win32
            python_arch: x86
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11 (${{ matrix.arch }})
      if: matrix.arch == 'x64'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: x64

    - name: Set up Python 3.11 (x86 manual install)
      if: matrix.arch == 'x86'
      run: |
        curl -L -o python-3.11.9-x86.exe https://www.python.org/ftp/python/3.11.9/python-3.11.9.exe
        python-3.11.9-x86.exe /quiet InstallAllUsers=0 TargetDir=C:\Python311-x86 Include_test=0
        echo "C:\Python311-x86" >> %GITHUB_PATH%
        echo "Python3_ROOT_DIR=C:\Python311-x86" >> %GITHUB_ENV%
      shell: cmd
    
    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
    
    - name: Create build directory
      run: |
        if not exist build mkdir build
        if not exist logs mkdir logs
      shell: cmd
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.cmake_platform }}
      shell: cmd
    
    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release
      shell: cmd
    
    - name: Create python directory
      run: mkdir build\Release\python
      shell: cmd
    
    - name: Setup python_runtime
      run: |
        $env:PYTHON_HOME = $env:Python3_ROOT_DIR
        .\setup_runtime.ps1 -BuildDir "build\Release" -UseFallback
      shell: pwsh
    
    - name: Copy test plugin
      run: copy python\test_plugin.far.py build\Release\test_plugin.far.py
      shell: cmd
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      shell: cmd
    
    - name: Find log files
      if: always()
      run: |
        echo "TEMP=%TEMP%"
        dir "%TEMP%\pythonfar_*.log" 2>nul || echo "No logs found in TEMP"
        dir "%USERPROFILE%\AppData\Local\Temp\pythonfar_*.log" 2>nul || echo "No logs found in AppData"
      shell: cmd
    
    - name: Copy logs to workspace
      if: always()
      run: |
        copy "%TEMP%\pythonfar_*.log" logs\ 2>nul
        copy "%USERPROFILE%\AppData\Local\Temp\pythonfar_*.log" logs\ 2>nul
        dir logs\
      shell: cmd
    
    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-logs-${{ matrix.arch }}
        path: logs\*.log
        if-no-files-found: ignore
    
    - name: Upload DLL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pythonfar-dlls-${{ matrix.arch }}
        path: |
          build/Release/PythonFar.dll
          build/Release/PythonFar.adapter.dll
          python/far_struct_offsets.json
        retention-days: 30
    
